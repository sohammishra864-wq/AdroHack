device: cpu                 # cpu | cuda
fast_tier_executor: threads # threads | processes  (set from the bench result)
fast_tier_workers: 8    # 7 fast checks; bench decides the final number
card_order: [forensics, clip_probe, localizer]
deep_tier_enabled: true
vae_count_cpu: 1
vae_count_gpu: 3
prewarm_on_launch: true
clip: {arch: ViT-L-14, pretrained: openai}           # open_clip; 224 px
vaes:   # AE reconstruction uses the first vae_count_{cpu,gpu}; local copy wins: <models>/vae/<name>
  sd15: {hf_id: stable-diffusion-v1-5/stable-diffusion-v1-5, subfolder: vae}
  sdxl: {hf_id: stabilityai/stable-diffusion-xl-base-1.0, subfolder: vae}   # same VAE, cached with the base model
  flux: {hf_id: black-forest-labs/FLUX.1-schnell, subfolder: vae}
trufor:   # paths relative to CLAIMSHIELD_MODELS_DIR; code vendored from grip-unina/TruFor
  src: trufor/test_docker/src
  cfg: trufor/test_docker/src/trufor.yaml
  weights: trufor/trufor.pth.tar
arena:   # live attack chain: Nova Canvas → local SD1.5 inpaint (CPU) → pre-generated
  prompt: "large dent and scratched paint, photorealistic, matching lighting"
  mask_prompt: "the largest flat surface"
  nova_timeout_s: 30
  local_model: stable-diffusion-v1-5/stable-diffusion-inpainting
  local_px: 384        # ARCHITECTURE: 384 px on CPU; drop steps to 15 if > 60 s (measure)
  local_steps: 15
  pregenerated_dir: data/arena/pregenerated   # filled by claimshield/arena/run.py
