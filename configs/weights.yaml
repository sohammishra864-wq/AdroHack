# Deterministic composite weights. Calibrate on the calib split only. No conditional gates.
image:
  localizer:          0.30
  clip_probe:         0.25
  ae_reconstruction:  0.20   # always on; confidence capped at 0.7 in code
  c2pa:               0.10   # contributes only when a manifest is present
  jpeg_qtables:       0.05   # applicable=False on PNG/HEIC
  exif:               0.04
  copy_move:          0.04
  noise_residual:     0.02
  family_map:         0.00   # explanation only
document:
  pdf_incremental_update: 0.35
  pdf_producer_mismatch:  0.15
  pdf_font_anomaly:       0.15
  field_arithmetic:       0.20
  field_dates:            0.10
  field_format:           0.05   # invoice no. / ICD-10 / MRZ check digits (ARCHITECTURE D2)
  ocr_confidence_dip:     0.05
  medical_billing:        0.50   # health upcoding; set by hand: 0.5 puts an upcoded bill at MEDIUM (0.45), clean stays LOW (0.13)
identity:
  face_match:       0.70
  selfie_synthetic: 0.30
claim:   # three consistency checks + the cross-claim memory (fraud-ring links)
  invoice_before_photo:  0.10
  camera_model_mismatch: 0.05
  name_mismatch:         0.10
  damage_story:          0.40   # zero-shot, confidence capped 0.5: a clear contradiction adds 0.12-0.16; set by hand
  cross_claim:           0.55   # set by hand: a reused photo adds 0.55·0.9 ≈ +0.50, so a clean claim
                                # (photo + invoice ≈ 0.21) ends ≈ 0.71 (HIGH). No ring data to calibrate on.
overall:
  formula: "0.5*max(lanes) + 0.5*mean(lanes) + claim_bonus"
